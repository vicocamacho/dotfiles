# Personal Herdr TUI configuration

onboarding = false

[keys]
# Backtick prefix, matching tmux config (unbind C-b / set prefix `)
prefix = "backtick"

# Rename tab — prefix+r
rename_tab = "prefix+r"

# Reload config — moved to prefix+shift+c to free up r for rename
reload_config = "prefix+shift+c"

# Vim-like pane focus — tmux: bind h/j/k/l select-pane
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Pane resize — tmux used prefix+H/J/K/L to resize by 3
# herdr uses resize mode: press prefix+shift+r, then h/j/k/l to resize, esc to exit
resize_mode = "prefix+shift+r"

# Swap panes (bonus, uses the Shift+hjkl herdr defaults)
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# Last pane — tmux: bind ^ last-window
last_pane = "prefix+^"

# Workspace picker (herdr built-in)
workspace_picker = "prefix+w"
switch_workspace = "alt+shift+1..9"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_agent = "alt+k"
next_agent = "alt+j"
focus_agent = "alt+1..9"

# Splits — matching tmux defaults
# prefix+% = vertical split (left/right), prefix+" = horizontal split (top/bottom)
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# Tab switching (1-indexed, matches tmux base-index 1)
switch_tab = "prefix+1..9"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[ui]
mouse_capture = true
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]
